<div class="container mt-4">
  <h2>Lista de Pagos</h2>

  <button class="btn btn-primary mb-3" (click)="crearNuevoPago()">Registrar Nuevo Pago</button>

  <div *ngIf="pagos.length === 0" class="alert alert-info">
    No hay pagos registrados.
  </div>

  <table class="table table-striped table-hover" *ngIf="pagos.length > 0">
    <thead>
      <tr>
        <th>ID</th>
        <th>Monto</th>
        <th>Método</th>
        <th>Estado</th>
        <th>Fecha de Pago</th>
        <th>Email Usuario</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let pago of pagos">
        <td>{{ pago.id }}</td>
        <td>{{ pago.monto }}</td>
        <td>{{ pago.metodo }}</td>
        <td>{{ pago.estado }}</td>
        <td>{{ pago.fechaPago | date:'shortDate' }}</td>
        <td>{{ pago.emailUsuario }}</td>
        <td>
          <button class="btn btn-info btn-sm me-2" (click)="verDetalles(pago.id)">Ver</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<div class="container text-center mx-auto" style="margin-top: 50px;">

  <div
    class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center mb-4 gap-3">

    <div class="d-flex align-items-center">
      <h3 class="mb-0" style="color: #f1f1f1;">
        <i class="bi bi-box-seam me-2"></i> Listado de Productos
      </h3>
    </div>

    <ng-container *ngIf="usuario$ | async as usuario">
      <div>
        <button type="button" class="btn" (click)="interfazAggProducto()"
          style="background-color:#004A24; color: #fff; display: flex; flex-direction: row-reverse;
          justify-content: flex-start; align-items: center; gap: 10px; padding: 10px 20px;
          border: none; border-radius: 8px; font-weight: 500; transition: background-color 0.3s ease, transform 0.2s ease;"
          onmouseover="this.style.backgroundColor='#005E2C'; this.style.transform='scale(1.05)'"
          onmouseout="this.style.backgroundColor='#004A24'; this.style.transform='scale(1)'">
          <i class="bi bi-file-earmark-plus"></i> Insertar Producto
        </button>
      </div>
    </ng-container>

    <div class="d-flex flex-wrap gap-2 ms-md-3 justify-content-center">
      <select class="form-select"
        style="background-color: #2c2f36; color: #fff; border: 1px solid #444; border-radius: 6px; width: 200px;"
        [(ngModel)]="filtroMarca">
        <option value="" disabled selected>Filtrar por Marca</option>
        <option value="Bosch">Bosch</option>
        <option value="Hyundai Mobis">Hyundai Mobis</option>
        <option value="Dayco">Dayco</option>
      </select>
      <input type="number" class="form-control"
        style="width: 150px; background-color: #2c2f36; color: #fff; border: 1px solid #444; border-radius: 6px; width: 170px;"
        placeholder="Precio máximo" [(ngModel)]="filtroPrecioMax">
      <input type="number" class="form-control"
        style="width: 170px; background-color: #2c2f36; color: #fff; border: 1px solid #444; border-radius: 6px; width: 190px;"
        placeholder="Cantidad mínima" [(ngModel)]="filtroCantidadMin">
    </div>
  </div>

  <table class="table table-dark table-striped table-hover align-middle rounded overflow-hidden"
    style="border: 1px solid #3a3a3a;">
    <thead style="background-color: #4b6cb7; color: #fff;">
      <tr>
        <th scope="col"><i class="bi bi-tag"></i> Nombre</th>
        <th scope="col"><i class="bi bi-currency-dollar"></i> Precio</th>
        <th scope="col"><i class="bi bi-box"></i> Cantidad</th>
        <th scope="col"><i class="bi bi-award"></i> Marca</th>
        <th scope="col"><i class="bi bi-eye"></i> Detalles</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngIf="productosFiltrados.length === 0">
        <td colspan="5" class="text-center text-muted" style="background-color: #1f1f1f;">
          <i class="bi bi-emoji-frown me-2"></i>No se encontraron productos con los filtros aplicados.
        </td>
      </tr>
      <tr *ngFor="let producto of productosFiltrados">
        <td>{{producto.nombre}}</td>
        <td>${{producto.precio}}</td>
        <td>{{producto.cantidad}}</td>
        <td>{{producto.marca}}</td>
        <td>
          <button class="btn btn-sm"
            style="border-radius: 6px; font-weight: 500; background-color: #0dcaf0; color: white; border: 1px solid #0dcaf0; transition: background-color 0.2s ease, color 0.2s ease;"
            onmouseover="this.style.backgroundColor='#17a2b8'; this.style.color='white'; borderColor='#17a2b8';"
            onmouseout="this.style.backgroundColor='#0dcaf0'; this.style.color='white'; borderColor='#0dcaf0';"
            (click)="abrirDetalles(producto.id)">
            <i class="bi bi-eye me-1"></i> Detalles
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

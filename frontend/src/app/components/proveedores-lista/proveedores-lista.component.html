<div class="container text-center mx-auto" style="margin-top: 50px; color: #f1f1f1;">

  <div
    class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center mb-4 gap-3">

    <div class="d-flex align-items-center">
      <h3 class="mb-0" style="color: #f1f1f1;">
        <i class="bi bi-truck me-2"></i> Listado de Proveedores
      </h3>
    </div>

    <button type="button" class="btn" (click)="interfazAggProveedor()" style="background-color:#198754; color: #fff; display: flex; flex-direction: row-reverse;
      justify-content: flex-start; align-items: center; gap: 10px; padding: 10px 20px;
      border: none; border-radius: 8px; font-weight: 500; transition: background-color 0.3s ease, transform 0.2s ease;"
      onmouseover="this.style.backgroundColor='#98754'; this.style.transform='scale(1.05)'"
      onmouseout="this.style.backgroundColor='#98754'; this.style.transform='scale(1)'">
      <i class="bi bi-file-earmark-plus"></i> Añadir Proveedores
    </button>

  </div>

  <div class="table-responsive">
    <table class="table table-dark table-striped table-hover align-middle rounded overflow-hidden"
      style="border: 1px solid #3a3a3a;">
      <thead style="background-color: #4b6cb7; color: #fff; font-size: 14px;">
        <tr>
          <th scope="col"><i class="bi bi-book-half me-1"></i> Nombre</th>
          <th scope="col"><i class="bi bi-geo-fill me-1"></i> Localización</th>
          <th scope="col"><i class="bi bi-r-square me-1"></i> Especialización</th>
          <th scope="col"><i class="bi bi-eye me-1"></i> Detalles</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngIf="proveedores.length === 0">
          <td colspan="4" class="text-center text-muted" style="background-color: #1f1f1f;">
            <i class="bi bi-emoji-frown me-2"></i>No se encontraron proveedores.
          </td>
        </tr>
        <tr *ngFor="let proveedor of proveedores">
          <td>{{proveedor.nombre}}</td>
          <td>{{proveedor.localizacion}}</td>
          <td>{{proveedor.especializacion}}</td>
          <td>
            <div style="display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;">
              <button class="btn btn-sm"
                style="border-radius: 6px; font-weight: 500; background-color: #0dcaf0; color: white; border: 1px solid #0dcaf0; transition: background-color 0.2s ease, color 0.2s ease;"
                onmouseover="this.style.backgroundColor='#17a2b8'; this.style.color='white'; this.style.borderColor='#17a2b8';"
                onmouseout="this.style.backgroundColor='#0dcaf0'; this.style.color='white'; this.style.borderColor='#0dcaf0';"
                (click)="abrirDetalles(proveedor.id)">
                <i class="bi bi-eye me-1"></i> Detalles
              </button>

              <button class="btn btn-sm"
                style="border-radius: 6px; font-weight: 500; background-color: #f0950d; color: white; border: 1px solid #f0950d; transition: background-color 0.2s ease, color 0.2s ease;"
                onmouseover="this.style.backgroundColor='#f0950d'; this.style.color='white'; this.style.borderColor='#f0950d';"
                onmouseout="this.style.backgroundColor='#f0950d'; this.style.color='white'; this.style.borderColor='#f0950d';"
                (click)="iniciarModificar(proveedor)">
                <i class="bi bi-pencil-square me-1"></i> Modificar
              </button>

              <button class="btn btn-sm"
                style="border-radius: 6px; font-weight: 500; background-color: #f0330d; color: white; border: 1px solid #f0330d; transition: background-color 0.2s ease, color 0.2s ease;"
                onmouseover="this.style.backgroundColor='#f0330d'; this.style.color='white'; this.style.borderColor='#f0330d8';"
                onmouseout="this.style.backgroundColor='#f0330d'; this.style.color='white'; this.style.borderColor='#f0330d';"
                (click)="abrirModalEliminar(proveedor.id)">
                <i class="bi bi-trash3 me-1"></i> Eliminar
              </button>
            </div>
          </td>

        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="mostrarModalEliminar" class="modal-backdrop"
    style="position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); z-index: 1050; display: flex; align-items: center; justify-content: center;">
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modalEliminarTitulo"
      aria-describedby="modalEliminarDescripcion" style="max-width: 400px; width: 90%;">
      <div class="modal-content" style="background: #2b3038; color: white; border-radius: 12px; padding: 20px;">
        <h5 id="modalEliminarTitulo" class="modal-title mb-3">Confirmar eliminación</h5>
        <p id="modalEliminarDescripcion">¿Está seguro que desea eliminar este proveedor?</p>

        <div *ngIf="mensajeErrorEliminar" class="alert alert-danger mt-3"
          style="border-radius: 8px; font-size: 0.95rem;">
          <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ mensajeErrorEliminar }}
        </div>

        <div class="d-flex justify-content-end gap-2 mt-4">
          <button class="btn btn-secondary" (click)="cancelarEliminar()">Cancelar</button>
          <button class="btn btn-danger" (click)="confirmarEliminar()">Eliminar</button>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="proveedorAModificar" class="modal-backdrop"
    style="position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); z-index: 1050; display: flex; align-items: center; justify-content: center;">
    <div class="modal-dialog" style="max-width: 500px; width: 90%;">
      <div class="modal-content" style="background: #2b3038; color: white; border-radius: 12px; padding: 20px;">
        <h5 class="modal-title mb-3">Modificar Proveedor</h5>

        <form (ngSubmit)="confirmarModificar()" #formProveedor="ngForm" novalidate>

          <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" class="form-control" [(ngModel)]="proveedorAModificar.nombre" name="nombre" required />
          </div>

          <div class="mb-3">
            <label class="form-label">Telefono</label>
            <input type="text" class="form-control" [(ngModel)]="proveedorAModificar.telefono" name="telefono"
              required />
          </div>

          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="text" class="form-control" [(ngModel)]="proveedorAModificar.email" name="email" required />
          </div>

          <div class="mb-3">
            <label class="form-label">Localización</label>
            <input type="text" class="form-control" [(ngModel)]="proveedorAModificar.localizacion" name="localizacion"
              required />
          </div>

          <div class="mb-3">
            <label for="especializacion" class="form-label">Especialización</label>
            <select id="especializacion" class="form-select" required [(ngModel)]="proveedorAModificar.especializacion"
              name="especializacion">
              <option
                *ngIf="!['Componentes mecanicos', 'Componentes electricos', 'Componentes de carroceria', 'Otros', 'No especificado'].includes(proveedorAModificar.especializacion)"
                [value]="proveedorAModificar.especializacion" selected disabled>
                {{ proveedorAModificar.especializacion }}
              </option>
              <option value="" disabled>Seleccione una opción</option>
              <option value="Componentes mecanicos">Componentes mecánicos</option>
              <option value="Componentes electricos">Componentes eléctricos</option>
              <option value="Componentes de carroceria">Componentes de carrocería</option>
              <option value="Otros">Otros</option>
              <option value="No especificado">No especificado</option>
            </select>
          </div>


          <div class="mb-3">
            <label class="form-label">Plazo de Entrega</label>
            <input type="text" class="form-control" [(ngModel)]="proveedorAModificar.plazoEntrega" name="entrega"
              required />
          </div>

          <div class="d-flex justify-content-end gap-2 mt-4">
            <button type="button" class="btn btn-secondary" (click)="cancelarModificar()">Cancelar</button>
            <button type="submit" [disabled]="formProveedor.invalid" class="btn btn-primary">Guardar</button>
          </div>

        </form>
      </div>
    </div>
  </div>
</div>

<div class="container">
  <nav class="navbar navbar-expand-lg"
    style="background: linear-gradient(90deg, #4b6cb7, #182848); font-family: 'Poppins', sans-serif;">
    <div class="container-fluid d-flex align-items-center">
      <a class="navbar-brand text-white me-4 pe-4" routerLink="/productos"
        style="font-weight: 800; font-size: 1.8rem; letter-spacing: 1px; text-shadow: 1px 1px 3px rgba(0,0,0,0.3); border-right: 2px solid rgba(240,165,0,0.5);">
        Corpomotriz Los Salias
      </a>

      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 d-flex align-items-center">
          <li class="nav-item ms-5">
            <a class="nav-link custom-nav-link" routerLink="/productos" routerLinkActive="active-link"
              [routerLinkActiveOptions]="{ exact: true }">
              <i class="bi bi-box-seam me-2"></i>Productos
            </a>
          </li>
          <li class="nav-item ms-5">
            <a class="nav-link custom-nav-link" routerLink="/pagos" routerLinkActive="active-link">
              <i class="bi bi-cash-stack me-2"></i>Pagos
            </a>
          </li>
          <li class="nav-item ms-5">
            <a class="nav-link custom-nav-link" routerLink="/proveedores" routerLinkActive="active-link">
              <i class="bi bi-truck me-2"></i>Proveedores
            </a>
          </li>
        </ul>

        <ul class="navbar-nav ms-2 align-items-center d-flex">
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="navbarDropdownPerfil" role="button"
              data-bs-toggle="dropdown" aria-expanded="false"
              style="background-color: #f0a500; color: #182848; border-radius: 8px; padding: 8px 18px; font-weight: 700; box-shadow: 0 3px 6px rgba(240,165,0,0.6); transition: background-color 0.3s ease;">
              Perfil
            </a>
            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdownPerfil"
              style="border-radius: 8px; box-shadow: 0 5px 15px rgba(24,40,72,0.3);">

              <li *ngIf="estaAutenticado">
                <a class="dropdown-item" routerLink="/perfil" style="font-weight: 600;">
                  <i class="bi bi-person-lines-fill me-2"></i>Examinar perfil
                </a>
              </li>

              <ng-container *ngIf="!estaAutenticado">
                <li>
                  <a class="dropdown-item" routerLink="/registro" style="font-weight: 600;">
                    <i class="bi bi-person-plus me-2"></i>Registrarse
                  </a>
                </li>
                <li>
                  <a class="dropdown-item" routerLink="/iniciar-sesion" style="font-weight: 600;">
                    <i class="bi bi-key-fill me-2"></i>Iniciar Sesión
                  </a>
                </li>
              </ng-container>

            </ul>
          </li>

          <li *ngIf="estaAutenticado" class="nav-item">
            <button (click)="cerrarSesion()" class="btn ms-3"
              style="background-color: #f05454; color: white; font-weight: 700; padding: 8px 18px; border-radius: 8px; box-shadow: 0 3px 8px rgba(240,84,84,0.6); transition: background-color 0.3s ease;">
              Cerrar Sesión
            </button>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</div>

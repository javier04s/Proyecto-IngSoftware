<div class="container mt-5"
  style="max-width: 600px; background-color: #1e1e1e; padding: 30px; border-radius: 16px; box-shadow: 0 0 20px rgba(0,0,0,0.5); font-family: 'Poppins', sans-serif; color: #f1f1f1;">

  <h2 style="font-weight: 700; text-align: center; margin-bottom: 30px; color: #ffffff;">
    {{ tituloFormulario }}
  </h2>

  <form (ngSubmit)="guardarPago()">

    <div class="mb-4">
      <label for="emailUsuario" style="color: #80bdff; font-weight: 500;">Correo Electronico:</label>
      <input type="email" id="emailUsuario" [(ngModel)]="pago.emailUsuario" name="emailUsuario" readonly
        class="form-control" style="background: #2b2b2b; border: 1px solid #444; border-radius: 8px; color: #f1f1f1;" />
    </div>

    <div class="mb-4">
      <label for="metodo" style="color: #80bdff; font-weight: 500;">Método de Pago:</label>
      <select id="metodo" class="form-select" [(ngModel)]="pago.metodo" name="metodo" required
        style="background: #2b2b2b; border: 1px solid #444; border-radius: 8px; color: #f1f1f1;">
        <option value="" disabled selected>Selecciona un método</option>
        <option *ngFor="let metodo of metodos" [value]="metodo">
          {{ metodo }}
        </option>
      </select>
    </div>

    <div *ngIf="pago.metodo === 'TARJETA'">
      <h4 style="color: #ffffff; margin-top: 30px; margin-bottom: 20px; text-align: center;">Detalles de la Tarjeta
        de Crédito</h4>

      <div class="mb-4">
        <label for="numeroTarjeta" style="color: #80bdff; font-weight: 500;">Número de Tarjeta:</label>
        <input type="text" id="numeroTarjeta" [(ngModel)]="pago.numeroTarjeta" name="numeroTarjeta" required
          pattern="[0-9]{13,19}" maxlength="19"
          class="form-control" style="background: #2b2b2b; border: 1px solid #444; border-radius: 8px; color: #f1f1f1;"
          placeholder="Ej: 1234567890123456" />
        <div *ngIf="pago.numeroTarjeta && !validarNumeroTarjeta(pago.numeroTarjeta)"
          style="color: #f44336; font-weight: 600; margin-top: 5px;">
          Número de tarjeta inválido. Debe contener entre 13 y 19 dígitos.
        </div>
      </div>

      <div class="row mb-4">
        <div class="col-md-6">
          <label for="fechaExpiracion" style="color: #80bdff; font-weight: 500;">Fecha de Expiración (MM/AA):</label>
          <input type="text" id="fechaExpiracion" [(ngModel)]="pago.fechaExpiracion" name="fechaExpiracion" required
            pattern="(0[1-9]|1[0-2])\/[0-9]{2}" maxlength="5"
            class="form-control" style="background: #2b2b2b; border: 1px solid #444; border-radius: 8px; color: #f1f1f1;"
            placeholder="MM/AA" />
          <div *ngIf="pago.fechaExpiracion && !validarFechaExpiracion(pago.fechaExpiracion)"
            style="color: #f44336; font-weight: 600; margin-top: 5px;">
            Fecha de expiración inválida o expirada (MM/AA).
          </div>
        </div>
        <div class="col-md-6">
          <label for="cvv" style="color: #80bdff; font-weight: 500;">CVV:</label>
          <input type="text" id="cvv" [(ngModel)]="pago.cvv" name="cvv" required
            pattern="[0-9]{3,4}" maxlength="4"
            class="form-control" style="background: #2b2b2b; border: 1px solid #444; border-radius: 8px; color: #f1f1f1;"
            placeholder="Ej: 123" />
          <div *ngIf="pago.cvv && !validarCvv(pago.cvv)"
            style="color: #f44336; font-weight: 600; margin-top: 5px;">
            CVV inválido. Debe contener 3 o 4 dígitos.
          </div>
        </div>
      </div>

      <div class="mb-4">
        <label for="nombreTitular" style="color: #80bdff; font-weight: 500;">Nombre del Titular:</label>
        <input type="text" id="nombreTitular" [(ngModel)]="pago.nombreTitular" name="nombreTitular" required
          class="form-control" style="background: #2b2b2b; border: 1px solid #444; border-radius: 8px; color: #f1f1f1;"
          placeholder="Ej: Juan Pérez" />
        <div *ngIf="pago.nombreTitular && !validarNombreTitular(pago.nombreTitular)"
          style="color: #f44336; font-weight: 600; margin-top: 5px;">
          El nombre del titular solo debe contener letras y espacios.
        </div>
      </div>
    </div>
    <div class="mb-4">
      <label style="color: #80bdff; font-weight: 500; display: block; margin-bottom: 12px;">Productos</label>

      <div *ngFor="let producto of pago.productos; let i = index" class="d-flex align-items-center mb-3"
        style="gap: 12px;">

        <select class="form-select" [(ngModel)]="producto.productoId" name="productoId{{ i }}" required
          style="flex: 1; background: #2b2b2b; border: 1px solid #444; border-radius: 8px; color: #f1f1f1; padding: 8px;">
          <option value="" disabled>Selecciona un producto</option>
          <option *ngFor="let p of productosDisponibles" [value]="p.id">
            {{ p.nombre }}
          </option>
        </select>

        <input type="number" min="1" [(ngModel)]="producto.cantidad" name="cantidad{{ i }}" required
          style="width: 90px; background: #2b2b2b; border: 1px solid #444; border-radius: 8px; color: #f1f1f1; padding: 8px;" />

        <button type="button" class="btn btn-danger" (click)="eliminarProducto(i)" title="Eliminar producto"
          style="border-radius: 8px; padding: 8px 14px; font-size: 18px; line-height: 1; transition: background-color 0.3s, transform 0.3s;"
          onmouseover="this.style.backgroundColor='#bd2130'; this.style.transform='scale(1.05)'"
          onmouseout="this.style.backgroundColor='#dc3545'; this.style.transform='scale(1)'">
          &times;
        </button>
      </div>

      <div *ngIf="errorStock"
        style="color: #f44336; font-weight: 600; margin-top: 8px; background-color: #330000; padding: 8px 12px; border-radius: 6px;">
        {{ errorStock }}
      </div>

      <div class="d-flex gap-3 mt-3">
        <button type="button" class="btn fw-bold" (click)="agregarProducto()"
          style="background-color: #007bff; color: #fff; border-radius: 10px; padding: 10px 20px; transition: background-color 0.3s, transform 0.3s;"
          onmouseover="this.style.backgroundColor='#0069d9'; this.style.transform='scale(1.05)'"
          onmouseout="this.style.backgroundColor='#007bff'; this.style.transform='scale(1)'">
          Agregar Producto
        </button>

        <button *ngIf="pago.productos.length > 0" type="button" class="btn fw-bold" (click)="aceptarProductos()"
          style="background-color: #28a745; color: #fff; border-radius: 10px; padding: 10px 20px; transition: background-color 0.3s, transform 0.3s;"
          onmouseover="this.style.backgroundColor='#218838'; this.style.transform='scale(1.05)'"
          onmouseout="this.style.backgroundColor='#28a745'; this.style.transform='scale(1)'">
          Aceptar
        </button>

      </div>
    </div>

    <div class="mb-4">
      <label for="monto" style="color: #80bdff; font-weight: 500;">Monto total:</label>
      <input type="number" id="monto" class="form-control" [(ngModel)]="pago.monto" name="monto" required min="0.01"
        step="0.01" readonly style="background: #2b2b2b; border: 1px solid #444; border-radius: 8px; color: #f1f1f1;" />
    </div>

    <div class="mb-4">
      <label for="estado" style="color: #80bdff; font-weight: 500;">Estado del Pago:</label>
      <select id="estado" class="form-select" [(ngModel)]="pago.estado" name="estado"
        [disabled]="rolUsuario === 'CLIENTE'"
        style="background: #2b2b2b; border: 1px solid #444; border-radius: 8px; color: #f1f1f1;">

        <ng-container *ngIf="rolUsuario === 'ADMINISTRADOR'">
          <option value="COMPLETADO">COMPLETADO</option>
          <option value="PENDIENTE">PENDIENTE</option>
          <option value="RECHAZADO">RECHAZADO</option>
        </ng-container>

        <ng-container *ngIf="rolUsuario === 'CLIENTE'">
          <option [value]="'PENDIENTE'" selected>PENDIENTE</option>
        </ng-container>

      </select>
    </div>

    <div class="d-flex justify-content-between">
      <button type="submit" class="btn fw-bold"
        style="background-color: #28a745; color: #fff; padding: 10px 20px; border-radius: 10px; font-size: 16px; transition: 0.3s ease;"
        onmouseover="this.style.backgroundColor='#218838'; this.style.transform='scale(1.05)'"
        onmouseout="this.style.backgroundColor='#28a745'; this.style.transform='scale(1)'">
        Guardar Pago
      </button>

      <button type="button" class="btn fw-semibold" (click)="cancelar()"
        style="padding: 10px 20px; background-color: #dc3545; color: #f1f1f1; border-radius: 10px; border: none; transition: 0.3s ease;"
        onmouseover="this.style.backgroundColor='#bd2130'; this.style.transform='scale(1.05)'"
        onmouseout="this.style.backgroundColor='#dc3545'; this.style.transform='scale(1)'">
        Cancelar
      </button>
    </div>

  </form>
</div>

<div class="container-fluid px-4" style="margin-top: 40px; color: #f1f1f1; font-family: 'Poppins', sans-serif;">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="mb-0" style="color: #f1f1f1; font-size: 2.2rem; font-weight: 700;">
      <i class="bi bi-credit-card me-2" style="font-size: 1.6rem;"></i> {{ tituloFormulario }}
    </h3>
  </div>

  <form (ngSubmit)="guardarPago()"
    style="background-color: #1f1f1f; padding: 30px; border-radius: 16px; box-shadow: 0 0 25px rgba(0,0,0,0.4);">
    <div class="row g-4">
      <div class="col-md-6">
        <div class="mb-3">
          <label for="emailUsuario" class="form-label" style="color: #80bdff;">Correo Electrónico</label>
          <input type="email" id="emailUsuario" [(ngModel)]="pago.emailUsuario" name="emailUsuario" readonly
            class="form-control"
            style="background: #2a2a2a; border: 1px solid #444; color: #f1f1f1; border-radius: 10px;">
        </div>

        <div class="mb-3">
          <label for="metodo" class="form-label" style="color: #80bdff;">Método de Pago</label>
          <select id="metodo" [(ngModel)]="pago.metodo" name="metodo" required class="form-control"
            style="background: #2a2a2a; border: 1px solid #444; color: #f1f1f1; border-radius: 10px;">
            <option value="" disabled>Selecciona un método</option>
            <option *ngFor="let metodo of metodos" [value]="metodo">{{ metodo }}</option>
          </select>
        </div>

        <div class="mb-3">
          <label for="estado" class="form-label" style="color: #80bdff;">Estado del Pago</label>
          <select id="estado" [(ngModel)]="pago.estado" name="estado" [disabled]="rolUsuario === 'USUARIO'" required
            class="form-control"
            style="background: #2a2a2a; border: 1px solid #444; color: #f1f1f1; border-radius: 10px;">

            <option value="PENDIENTE">PENDIENTE</option>
            <option *ngIf="rolUsuario === 'ADMINISTRADOR'" value="COMPLETADO">COMPLETADO</option>
            <option *ngIf="rolUsuario === 'ADMINISTRADOR'" value="RECHAZADO">RECHAZADO</option>
          </select>
        </div>

        <div class="mb-3">
          <label for="monto" class="form-label" style="color: #80bdff;">Monto Total</label>
          <input type="number" id="monto" [(ngModel)]="pago.monto" name="monto" readonly class="form-control"
            style="background: #2a2a2a; border: 1px solid #444; color: #f1f1f1; border-radius: 10px;">
        </div>
      </div>

      <div class="col-md-6">
        <div class="mb-3">
          <label for="numeroTarjeta" class="form-label" style="color: #80bdff;">Número de Tarjeta</label>
          <input type="text" id="numeroTarjeta" [(ngModel)]="pago.numeroTarjeta" name="numeroTarjeta" required
            pattern="[0-9]{13,19}" maxlength="19" class="form-control" placeholder="Ej: 1234567890123456"
            style="background: #2a2a2a; border: 1px solid #444; color: #f1f1f1; border-radius: 10px;">
          <div *ngIf="pago.numeroTarjeta && !validarNumeroTarjeta(pago.numeroTarjeta)"
            class="invalid-feedback d-block text-danger fw-semibold mt-1">
            Número de tarjeta inválido.
          </div>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="fechaExpiracion" class="form-label" style="color: #80bdff;">Fecha de Expiración</label>
            <input type="text" id="fechaExpiracion" [(ngModel)]="pago.fechaExpiracion" name="fechaExpiracion" required
              pattern="(0[1-9]|1[0-2])\/[0-9]{2}" maxlength="5" placeholder="MM/AA" class="form-control"
              style="background: #2a2a2a; border: 1px solid #444; color: #f1f1f1; border-radius: 10px;">
            <div *ngIf="pago.fechaExpiracion && !validarFechaExpiracion(pago.fechaExpiracion)"
              class="invalid-feedback d-block text-danger fw-semibold mt-1">
              Fecha inválida o expirada.
            </div>
          </div>

          <div class="col-md-6 mb-3">
            <label for="cvv" class="form-label" style="color: #80bdff;">CVV</label>
            <input type="text" id="cvv" [(ngModel)]="pago.cvv" name="cvv" required pattern="[0-9]{3,4}" maxlength="4"
              class="form-control" placeholder="Ej: 123"
              style="background: #2a2a2a; border: 1px solid #444; color: #f1f1f1; border-radius: 10px;">
            <div *ngIf="pago.cvv && !validarCvv(pago.cvv)"
              class="invalid-feedback d-block text-danger fw-semibold mt-1">
              CVV inválido.
            </div>
          </div>
        </div>

        <div class="mb-3">
          <label for="nombreTitular" class="form-label" style="color: #80bdff;">Nombre del Titular</label>
          <input type="text" id="nombreTitular" [(ngModel)]="pago.nombreTitular" name="nombreTitular" required
            class="form-control" placeholder="Ej: Juan Pérez"
            style="background: #2a2a2a; border: 1px solid #444; color: #f1f1f1; border-radius: 10px;">
          <div *ngIf="pago.nombreTitular && !validarNombreTitular(pago.nombreTitular)"
            class="invalid-feedback d-block text-danger fw-semibold mt-1">
            Solo se permiten letras y espacios.
          </div>
        </div>
      </div>
    </div>

    <div class="mb-3 mt-4">
      <label class="form-label" style="color: #80bdff;">Productos</label>
      <div *ngFor="let producto of pago.productos; let i = index" class="d-flex align-items-center gap-3 mb-3">
        <select class="form-control" [(ngModel)]="producto.productoId" name="productoId{{ i }}" required
          style="background: #2a2a2a; border: 1px solid #444; color: #f1f1f1; border-radius: 10px;">
          <option value="" disabled>Selecciona un producto</option>
          <option *ngFor="let p of productosDisponibles" [value]="p.id">{{ p.nombre }}</option>
        </select>

        <input type="number" min="1" [(ngModel)]="producto.cantidad" name="cantidad{{ i }}" required
          class="form-control" placeholder="Cant."
          style="max-width: 100px; background: #2a2a2a; border: 1px solid #444; color: #f1f1f1; border-radius: 10px;">

        <button type="button" class="btn btn-danger" (click)="eliminarProducto(i)"
          style="border-radius: 8px; font-weight: bold;">&times;</button>
      </div>

      <div *ngIf="errorStock" class="text-danger fw-semibold mt-2">
        {{ errorStock }}
      </div>

      <button type="button" class="btn btn-info mt-3 me-2" (click)="agregarProducto()">
        <i></i> Agregar Producto
      </button>

      <button *ngIf="pago.productos.length > 0" type="button" class="btn btn-success mt-3" (click)="aceptarProductos()">
        <i></i> Aceptar
      </button>
    </div>

    <div class="d-flex justify-content-end gap-3 mt-4">
      <button type="button" class="btn btn-secondary" (click)="cancelar()">
        <i></i> Cancelar
      </button>
      <button type="submit" class="btn btn-primary">
        <i></i> Guardar Pago
      </button>
    </div>
  </form>
</div>

<div class="container mx-auto" style="margin-top: 25px;">
  <h2 class="mb-4" style="color: #f1f1f1;">
    <i class="bi bi-box-seam me-2"></i>Productos del Proveedor
  </h2>

  <ul class="list-group mb-4" style="background-color: #1e1e1e; border-radius: 8px; overflow: hidden;">
    <li 
      class="list-group-item" 
      *ngFor="let producto of productos" 
      style="background-color: #2c2f36; color: #fff; border-color: #444;"
    >
      <strong>Nombre:</strong> {{ producto.nombre }} <br>
      <strong>Precio:</strong> {{ producto.precio | currency:'USD' }} <br>
      <strong>Cantidad:</strong> {{ producto.cantidad }} <br>
      <strong>Marca:</strong> {{ producto.marca }}
    </li>
  </ul>

  <ng-template #sinProductos>
    <p style="color: #ccc;">Este proveedor aún no tiene productos registrados.</p>
  </ng-template>

  <div class="mt-4 d-flex gap-3 justify-content-center">
    <button 
      class="btn" 
      style="background-color: #444; color: #fff; border-radius: 8px; padding: 10px 20px; font-weight: 500;
             transition: background-color 0.3s ease, transform 0.2s ease;"
      (click)="volverDetalle()"
      onmouseover="this.style.backgroundColor='#5a5a5a'; this.style.transform='scale(1.05)'"
      onmouseout="this.style.backgroundColor='#444'; this.style.transform='scale(1)'"
    >
      <i class="bi bi-arrow-left-circle me-2"></i> Volver
    </button>
  </div>
</div>

<div class="container mt-5" style="max-width: 600px;">
  <div
    style="background-color: #1e1e1e; padding: 30px; border-radius: 16px; box-shadow: 0 0 20px rgba(0,0,0,0.5); font-family: 'Poppins', sans-serif; color: #f1f1f1;">
    <h2 class="text-center mb-4" style="font-weight: 700; color: #ffffff; margin-bottom: 30px;">
      Registro de Usuario
    </h2>

    <form [formGroup]="registroForm" (ngSubmit)="onSubmit()">

      <div class="mb-4">
        <label for="nombre" style="color: #80bdff; font-weight: 500;">Nombre:</label>
        <input id="nombre" formControlName="nombre" type="text" placeholder="Ingrese su nombre" class="form-control"
          style="background: #2b2b2b; border: 1px solid #444; border-radius: 8px; color: #f1f1f1;"
          [class.is-invalid]="registroForm.get('nombre')?.invalid && registroForm.get('nombre')?.touched" />
        <div *ngIf="registroForm.get('nombre')?.invalid && registroForm.get('nombre')?.touched" class="invalid-feedback"
          style="color: #dc3545;">
          El nombre es requerido.
        </div>
      </div>

      <div class="mb-4">
        <label for="email" style="color: #80bdff; font-weight: 500;">Correo electrónico:</label>
        <input id="email" formControlName="email" type="email" placeholder="ejemplo@correo.com" class="form-control"
          style="background: #2b2b2b; border: 1px solid #444; border-radius: 8px; color: #f1f1f1;"
          [class.is-invalid]="registroForm.get('email')?.invalid && registroForm.get('email')?.touched" />
        <div *ngIf="registroForm.get('email')?.invalid && registroForm.get('email')?.touched" class="invalid-feedback"
          style="color: #dc3545;">
          El correo es requerido y debe ser válido.
        </div>
      </div>

      <div class="mb-4">
        <label for="contrasena" style="color: #80bdff; font-weight: 500;">Contraseña:</label>
        <input id="contrasena" formControlName="contrasena" type="password" placeholder="Mínimo 6 caracteres"
          class="form-control" style="background: #2b2b2b; border: 1px solid #444; border-radius: 8px; color: #f1f1f1;"
          [class.is-invalid]="registroForm.get('contrasena')?.invalid && registroForm.get('contrasena')?.touched" />
        <div *ngIf="registroForm.get('contrasena')?.invalid && registroForm.get('contrasena')?.touched"
          class="invalid-feedback" style="color: #dc3545;">
          La contraseña es requerida y debe tener mínimo 6 caracteres.
        </div>
      </div>

      <div class="mb-4">
        <label for="rol" style="color: #80bdff; font-weight: 500;">Rol:</label>
        <div class="form-control"
          style="background-color: #2b2b2b; color: #6c757d; font-weight: 600; border-radius: 8px; cursor: not-allowed;">
          Cliente
        </div>
      </div>

      <div class="d-flex justify-content-center mt-4">
        <button type="submit" class="btn fw-bold" [disabled]="registroForm.invalid"
          style="background-color: #28a745; color: #fff; padding: 12px 30px; border-radius: 10px; font-size: 16px; transition: 0.3s ease; border-color: #28a745;"
          onmouseover="this.style.backgroundColor='#218838'; this.style.transform='scale(1.05)'"
          onmouseout="this.style.backgroundColor='#28a745'; this.style.transform='scale(1)'">
          Confirmar
        </button>
      </div>

    </form>
  </div>
</div>

<div class="container text-center mx-auto" style="margin-top: 50px; color: #f1f1f1; max-width: 900px;">

  <h3 class="mb-4" style="color: #f1f1f1;">
    <i class="bi bi-people me-2"></i> Usuarios Registrados
  </h3>

  <div *ngIf="error" class="alert alert-danger text-start" style="max-width: 600px; margin: 0 auto;">
    {{ error }}
  </div>

  <div *ngIf="!error && usuariosRegistrados.length > 0" class="table-responsive" style="border: 1px solid #3a3a3a; border-radius: 8px; overflow: hidden; max-width: 900px; margin: 0 auto;">
    <table class="table table-dark table-striped table-hover align-middle text-center mb-0">
      <thead style="background-color: #4b6cb7; color: #fff; font-size: 14px; font-weight: 600;">
        <tr>
          <th scope="col"><i class="bi bi-person-badge me-1"></i> Nombre</th>
          <th scope="col"><i class="bi bi-envelope me-1"></i> Correo</th>
          <th scope="col"><i class="bi bi-shield-lock me-1"></i> Rol</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of usuariosRegistrados" style="cursor: default;">
          <td>{{ user.nombre }}</td>
          <td>{{ user.email }}</td>
          <td>{{ user.rol }}</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="!error && usuariosRegistrados.length === 0" class="text-center mt-4" style="color: #6c757d;">
    No hay usuarios registrados.
  </div>

</div>

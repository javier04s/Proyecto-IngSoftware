<div class="container-fluid text-center mx-auto mt-5 px-4">

  <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center mb-4 gap-3">

    <div class="d-flex align-items-center">
      <h3 class="mb-0">
        <i class="bi bi-cash-stack me-2"></i> Lista de Pagos
      </h3>
    </div>

    <button class="btn btn-outline-primary d-flex align-items-center" (click)="crearNuevoPago()">
      <i class="bi bi-plus-circle me-2"></i> Registrar Nuevo Pago
    </button>

  </div>

  <div *ngIf="pagos.length === 0" class="alert alert-info text-center fw-semibold">
    No hay pagos registrados.
  </div>

  <div class="table-responsive">
    <table
      *ngIf="pagos.length > 0"
      class="table table-striped table-hover align-middle w-100"
    >
      <thead class="table-primary">
        <tr>
          <th><i class="bi bi-hash me-1"></i>ID</th>
          <th><i class="bi bi-currency-dollar me-1"></i>Monto</th>
          <th><i class="bi bi-credit-card me-1"></i>Método</th>
          <th><i class="bi bi-check2-circle me-1"></i>Estado</th>
          <th><i class="bi bi-calendar-event me-1"></i>Fecha de Pago</th>
          <th><i class="bi bi-envelope me-1"></i>Email Usuario</th>
          <th><i class="bi bi-eye me-1"></i>Modificar</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let pago of pagos" style="cursor: default;">
          <td>{{ pago.id }}</td>
          <td>{{ pago.monto | currency:'USD' }}</td>
          <td>{{ pago.metodo }}</td>
          <td>{{ pago.estado }}</td>
          <td>{{ pago.fechaPago | date:'shortDate' }}</td>
          <td>{{ pago.emailUsuario }}</td>
          <td>
            <button
              class="btn btn-outline-info btn-sm d-flex align-items-center"
              (click)="verDetalles(pago.id)"
            >
              <i class="bi bi-eye me-1"></i> Modificar
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</div>

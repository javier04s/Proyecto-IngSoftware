<form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form container p-4 shadow rounded" style="max-width: 400px; margin-top: 50px; background: #f9fbff; font-family: 'Poppins', sans-serif;">
  <h2 class="mb-4 text-center" style="font-weight: 800; color: #182848;">
    Iniciar Sesión
  </h2>

  <div class="mb-3 position-relative">
    <label for="email" class="form-label fw-semibold text-primary">Correo electrónico:</label>
    <div class="input-group">
      <span class="input-group-text bg-primary text-white">
        <i class="bi bi-envelope-fill"></i>
      </span>
      <input id="email" formControlName="email" type="email" class="form-control" placeholder="ejemplo@correo.com" />
    </div>
  </div>

  <div class="mb-4 position-relative">
    <label for="contrasena" class="form-label fw-semibold text-primary">Contraseña:</label>
    <div class="input-group">
      <span class="input-group-text bg-primary text-white">
        <i class="bi bi-lock-fill"></i>
      </span>
      <input id="contrasena" formControlName="contrasena" type="password" class="form-control" placeholder="Tu contraseña" />
    </div>
  </div>

  <button type="submit" class="btn btn-primary w-100 fw-bold" [disabled]="loginForm.invalid" style="font-size: 1.1rem; padding: 10px;">
    <i class="bi bi-box-arrow-in-right me-2"></i> Entrar
  </button>

  <div *ngIf="errorMessage" class="error-message mt-3 text-danger fw-semibold text-center">
    {{ errorMessage }}
  </div>
</form>

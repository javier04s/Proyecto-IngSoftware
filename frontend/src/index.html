<!doctype html>
<html lang="es" data-bs-theme="dark">

<head>
  <meta charset="utf-8">
  <title>Corpomotriz Los Salias</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Roboto:wght@400;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

  <style>
    body {
      margin: 0;
      font-family: 'Montserrat', 'Roboto', sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #f1f1f1;
      min-height: 100vh;
      overflow-x: hidden;
    }

    ::-webkit-scrollbar {
      width: 10px;
    }

    ::-webkit-scrollbar-thumb {
      background: #4b6cb7;
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #3556a3;
    }

    a {
      color: #f0a500;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    a:hover {
      color: #ffd369;
    }

    button, .btn {
      transition: background-color 0.3s ease, box-shadow 0.3s ease;
    }

    .btn-primary {
      background-color: #4b6cb7;
      border: none;
    }

    .btn-primary:hover {
      background-color: #3556a3;
      box-shadow: 0 4px 12px rgba(75, 108, 183, 0.5);
    }

    .btn-warning {
      background-color: #f0a500;
      color: #182848;
      font-weight: 600;
    }

    .btn-warning:hover {
      background-color: #e69500;
    }

    .dropdown-menu {
      background-color: #1c1f26;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .dropdown-item {
      color: #f1f1f1;
    }

    .dropdown-item:hover {
      background-color: #2a2e39;
      color: #ffd369;
    }
  </style>
</head>

<body>
  <app-root></app-root>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
    crossorigin="anonymous"></script>
</body>

</html>
